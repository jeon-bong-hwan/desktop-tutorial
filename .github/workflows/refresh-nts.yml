name: Query NTS business status
on:
  workflow_dispatch:
  schedule:
    - cron: '43 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: station-data-refresh
  cancel-in-progress: false
jobs:
  nts:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.NTS_SYNC_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/station-workspace
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Query NTS on server only
        id: lookup
        continue-on-error: true
        env:
          NTS_API_KEY: ${{ secrets.NTS_API_KEY }}
          NTS_TARGETS_JSON: ${{ secrets.NTS_TARGETS_JSON }}
        run: python3 tools/sync_nts.py
      - name: Save status without credentials or business numbers
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sync/nts.json
          if ! git diff --cached --quiet; then
            git commit -m "Update NTS tax status snapshot"
            git push origin HEAD:codex/station-workspace
          fi
      - run: npm test && npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Report unsuccessful collection
        if: steps.lookup.outcome == 'failure'
        run: exit 1
