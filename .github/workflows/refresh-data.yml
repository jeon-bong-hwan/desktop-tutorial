name: Refresh official station licensing data
on:
  schedule:
    - cron: '17 21 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: station-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: ${{ vars.STATION_CSV_URL != '' || vars.STATION_API_URL != '' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/station-workspace
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect official snapshot
        id: collect
        continue-on-error: true
        env:
          STATION_CSV_URL: ${{ vars.STATION_CSV_URL }}
          STATION_API_URL: ${{ vars.STATION_API_URL }}
          STATION_API_KEY: ${{ secrets.STATION_API_KEY }}
        run: python3 tools/sync_data.py
      - name: Save snapshot and collection status
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add initial-data.js sync/status.json sync/changes.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh station API snapshot and collection status"
            git push origin HEAD:codex/station-workspace
          fi
      - name: Build snapshot and status
        run: npm test && npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish snapshot and status
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report source failure
        if: steps.collect.outcome == 'failure'
        run: exit 1
